<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="%sveltekit.assets%/icon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.json" />
    <meta name="theme-color" content="#4F46E5" />
    <meta name="description" content="Free vaccination tracker for your family. 100% private, no account needed - your data stays on your device." />
    <title>VaxTrack</title>
    <script>
      if (location.hostname === 'www.vaxtrack.net') location.replace('https://vaxtrack.net' + location.pathname + location.search);
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
